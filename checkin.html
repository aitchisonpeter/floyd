<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <title>Floyd — Check-in</title>
  <style>
    :root { --bg:#000; --card:rgba(255,255,255,0.04); --me:rgba(237,191,55,0.14);
            --floyd:rgba(255,255,255,0.07); --gold:#edbf37; --green:#80cc80;
            --text:#fff; --muted:rgba(255,255,255,0.5); --border:rgba(255,255,255,0.12); }
    * { box-sizing:border-box; }
    body { font-family:-apple-system,sans-serif; background:var(--bg); color:var(--text);
           margin:0; height:100vh; display:flex; flex-direction:column; }
    header { padding:14px 18px; border-bottom:1px solid var(--border); display:flex;
             align-items:center; justify-content:space-between; }
    header h1 { font-size:0.8rem; text-transform:uppercase; letter-spacing:3px; color:var(--muted); margin:0; font-weight:400; }
    #status { font-size:0.65rem; color:var(--muted); letter-spacing:1px; }
    #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
    .msg { max-width:85%; padding:11px 14px; border-radius:18px; font-size:0.95rem; line-height:1.45; white-space:pre-wrap; }
    .msg.me { align-self:flex-end; background:var(--me); border:1px solid rgba(237,191,55,0.3); }
    .msg.floyd { align-self:flex-start; background:var(--floyd); border:1px solid var(--border); }
    .chips { align-self:flex-start; display:flex; flex-wrap:wrap; gap:6px; max-width:85%; }
    .chip { font-size:0.68rem; padding:4px 9px; border-radius:12px; border:1px solid; letter-spacing:0.3px; }
    .chip.log { color:var(--green); border-color:rgba(128,204,128,0.4); background:rgba(128,204,128,0.08); }
    .chip.propose { color:var(--gold); border-color:rgba(237,191,55,0.4); background:rgba(237,191,55,0.08); }
    .typing { align-self:flex-start; color:var(--muted); font-size:0.85rem; font-style:italic; }
    footer { padding:12px; border-top:1px solid var(--border); display:flex; gap:10px; align-items:flex-end; }
    #input { flex:1; background:var(--card); border:1px solid var(--border); border-radius:20px;
             color:var(--text); font-size:0.95rem; padding:11px 14px; outline:none; resize:none;
             max-height:120px; font-family:-apple-system,sans-serif; }
    button { border:none; border-radius:50%; width:46px; height:46px; flex:none; cursor:pointer;
             font-size:1.2rem; display:flex; align-items:center; justify-content:center; }
    #mic { background:var(--card); border:1px solid var(--border); color:var(--text); }
    #mic.live { background:rgba(233,133,140,0.25); border-color:#e9858c; }
    #send { background:rgba(237,191,55,0.18); border:1px solid rgba(237,191,55,0.4); color:var(--gold); }
    #send:disabled { opacity:0.4; }
  </style>
</head>
<body>
  <header>
    <h1>Floyd</h1>
    <div style="display:flex;align-items:center;gap:12px;">
      <span id="status">connecting…</span>
      <button id="done" title="Finish check-in"
        style="width:auto;height:auto;border-radius:14px;background:rgba(128,204,128,0.12);
        border:1px solid rgba(128,204,128,0.4);color:var(--green);font-size:0.62rem;
        letter-spacing:1px;text-transform:uppercase;padding:6px 12px;">Done</button>
    </div>
  </header>
  <div id="log"></div>
  <footer>
    <button id="mic" title="Hold/tap to talk">🎤</button>
    <textarea id="input" rows="1" placeholder="Talk to Floyd…"></textarea>
    <button id="send" title="Send">↑</button>
  </footer>

  <script src="config.js"></script>
  <script>
    const CFG = (typeof FLOYD_CONFIG !== "undefined") ? FLOYD_CONFIG : {};
    const CHAT_URL = CFG.chat_url || "https://floyd-chat.aitchisonpeter.workers.dev";
    const TOKEN    = CFG.api_secret || "";
    const logEl = document.getElementById("log");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const micBtn = document.getElementById("mic");
    const statusEl = document.getElementById("status");
    let history = [];      // text turns {role, content}
    let busy = false;

    // The worker rebuilds Claude's messages from this text-only history, so
    // tool calls from earlier turns are invisible to the model. Appending a
    // "[logged: ...]" line to each stored assistant turn gives it (and the
    // worker's hard dedupe) a durable record of what's already in the sheet.
    // Bubbles render the clean reply; only history carries the marker.
    function loggedMarker(actions) {
      const logged = (actions || []).filter(a => a.kind === "log");
      if (!logged.length) return "";
      const item = a => (a.tag + " " + (a.value || "")).replace(/[\[\]]/g, ")").trim();
      return "\n[logged: " + logged.map(item).join(" ⋮ ") + "]";
    }

    function bubble(role, text) {
      const d = document.createElement("div");
      d.className = "msg " + (role === "user" ? "me" : "floyd");
      d.textContent = text;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
      return d;
    }
    function chips(actions) {
      if (!actions || !actions.length) return;
      const wrap = document.createElement("div");
      wrap.className = "chips";
      actions.forEach(a => {
        const c = document.createElement("span");
        if (a.kind === "log") { c.className = "chip log"; c.textContent = "✓ " + a.tag + " " + (a.value || ""); }
        else { c.className = "chip propose"; c.textContent = "💡 proposed: " + (a.description || a.type); }
        wrap.appendChild(c);
      });
      logEl.appendChild(wrap);
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function send(text, isOpening) {
      if (busy) return;
      if (!isOpening) { bubble("user", text); history.push({ role: "user", content: text }); }
      inputEl.value = ""; autoSize();
      busy = true; sendBtn.disabled = true; statusEl.textContent = "Floyd is thinking…";
      const typing = document.createElement("div");
      typing.className = "typing"; typing.textContent = "…"; logEl.appendChild(typing);
      logEl.scrollTop = logEl.scrollHeight;
      // Stream the reply (SSE): text fills a bubble token-by-token, chips appear
      // as tools run. No auto-retry on failure — a re-run would double-log.
      let replyEl = null, replyText = "", errored = false;
      const turnActions = [];
      const ensureReply = () => { if (!replyEl) { typing.remove(); replyEl = bubble("floyd", ""); } return replyEl; };
      try {
        const res = await fetch(CHAT_URL, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ token: TOKEN, messages: history, stream: true }),
        });
        if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
        // Robust to deploy order: if the worker answered with plain JSON (older
        // build, no streaming), fall back to the original one-shot rendering.
        if (!(res.headers.get("content-type") || "").includes("text/event-stream")) {
          const data = await res.json();
          typing.remove();
          if (data.error) { bubble("floyd", "⚠️ " + data.error); }
          else {
            if (data.reply) { bubble("floyd", data.reply); history.push({ role: "assistant", content: data.reply + loggedMarker(data.actions) }); }
            chips(data.actions);
          }
          busy = false; sendBtn.disabled = false; statusEl.textContent = "";
          return;
        }
        const reader = res.body.getReader();
        const dec = new TextDecoder();
        let buf = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          let nl;
          while ((nl = buf.indexOf("\n")) >= 0) {
            const line = buf.slice(0, nl).trim();
            buf = buf.slice(nl + 1);
            if (!line.startsWith("data:")) continue;
            let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
            if (ev.type === "text") {
              replyText += ev.delta;
              ensureReply().textContent = replyText;
              statusEl.textContent = ""; logEl.scrollTop = logEl.scrollHeight;
            } else if (ev.type === "action") {
              turnActions.push(ev.action);
              chips([ev.action]);
            } else if (ev.type === "error") {
              errored = true; ensureReply().textContent = "⚠️ " + ev.error;
            }
          }
        }
        typing.remove();
        if (!errored && replyText) history.push({ role: "assistant", content: replyText + loggedMarker(turnActions) });
        else if (!replyEl) bubble("floyd", "⚠️ Floyd had nothing to say.");
      } catch (e) {
        typing.remove(); bubble("floyd", "⚠️ Couldn't reach Floyd. " + e.message);
      }
      busy = false; sendBtn.disabled = false; statusEl.textContent = "";
    }

    function autoSize() { inputEl.style.height = "auto"; inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px"; }
    inputEl.addEventListener("input", autoSize);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); const t = inputEl.value.trim(); if (t) send(t); }
    });
    sendBtn.onclick = () => { const t = inputEl.value.trim(); if (t) send(t); };

    // Voice — continuous dictation into the input box
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let rec = null, listening = false;
    if (SR) {
      rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = "en-US";
      let base = "";
      rec.onresult = (e) => {
        // Rebuild the whole transcript from all results each event — accumulating
        // from resultIndex double-appends on mobile. base = text before dictation.
        let txt = "";
        for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript + " ";
        inputEl.value = (base + txt).replace(/\s+/g, " ").trim(); autoSize();
      };
      rec.onend = () => { listening = false; micBtn.classList.remove("live"); };
      micBtn.onclick = () => {
        if (listening) { rec.stop(); return; }
        base = inputEl.value ? inputEl.value.trim() + " " : "";
        try { rec.start(); listening = true; micBtn.classList.add("live"); } catch (e) {}
      };
    } else {
      micBtn.style.display = "none";
    }

    // Done — wrap up gracefully: Floyd recaps + logs a #session, then the UI closes.
    const doneBtn = document.getElementById("done");
    doneBtn.onclick = async () => {
      if (busy || history.length === 0) return;
      await send("That's everything for now — thanks, Floyd.");
      inputEl.disabled = true; sendBtn.disabled = true; micBtn.disabled = true; doneBtn.disabled = true;
      statusEl.textContent = "check-in complete ✓";
      const nb = document.createElement("button");
      nb.textContent = "New check-in";
      nb.style.cssText = "align-self:center;margin-top:10px;width:auto;height:auto;border-radius:18px;" +
        "background:var(--card);border:1px solid var(--border);color:var(--text);font-size:0.8rem;padding:9px 20px;";
      nb.onclick = () => location.reload();
      logEl.appendChild(nb); logEl.scrollTop = logEl.scrollHeight;
    };

    // Floyd opens the check-in with context
    if (!TOKEN) { statusEl.textContent = "no token"; bubble("floyd", "⚠️ config.js missing api_secret."); }
    else { statusEl.textContent = ""; send("", true); }
  </script>
</body>
</html>
