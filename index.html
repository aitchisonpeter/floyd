<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" id="touch-icon" href="tuliptown.webp">
  <link rel="icon" type="image/png" id="favicon" href="bdv_icon.png">
  <link rel="manifest" href="manifest.json">
  <title id="page-title">Floyd</title>
  <style>
    :root {
      --bg: #000;
      --card-bg: rgba(0,0,0,0.85);
      --label-color: rgba(255,255,255,0.5);
      --text-color: #fff;
      --accent: #edbf37;
    }
    body {
      font-family: -apple-system, sans-serif;
      display: flex; justify-content: center;
      background: var(--bg);
      color: var(--text-color);
      margin: 0; padding: 20px 0; min-height: 100vh;
      transition: background 1s ease, color 0.5s ease;
    }
    .card {
      padding: 2.5rem; border-radius: 35px; width: 90%; max-width: 450px;
      backdrop-filter: blur(20px);
      background: var(--card-bg);
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      z-index: 10;
      transition: background 1s ease;
    }
    .status-item { margin-bottom: 1.6rem; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 0.6rem; }
    .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 0.4rem; color: var(--label-color); }
    .value { font-size: 1.5rem; font-weight: 300; display: block; color: var(--text-color); word-break: break-word; }
    .value-daily_allowance { font-size: 4rem; font-weight: 200; color: var(--accent); line-height: 1; margin-bottom: 10px; }
    .location-container { display: flex; align-items: center; justify-content: space-between; }
    .mode-icon {
      width: 75px; height: 75px; border-radius: 15px;
      background-size: cover; background-repeat: no-repeat; background-position: center;
      border: none; transition: transform 0.1s;
    }
    .mode-icon:active { transform: scale(0.95); }
    .quick-log {
      margin-top: 1.8rem;
      padding-top: 1.4rem;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .quick-log-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      color: var(--text-color);
      font-size: 1rem;
      font-weight: 300;
      padding: 6px 0 8px 0;
      outline: none;
      font-family: -apple-system, sans-serif;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }
    .quick-log-input:focus { border-color: rgba(255,255,255,0.5); }
    .quick-log-input::placeholder { color: var(--label-color); font-size: 0.9rem; }
    .quick-log-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      min-height: 28px;
    }
    .quick-log-tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--label-color);
      transition: color 0.3s;
    }
    .quick-log-tag.active { color: var(--accent); }
    .quick-log-submit {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text-color);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 6px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }
    .quick-log-submit:active { opacity: 0.7; }
    .quick-log-submit.sending { opacity: 0.5; pointer-events: none; }
    .quick-log-feedback {
      font-size: 0.75rem;
      color: var(--accent);
      text-align: center;
      margin-top: 8px;
      min-height: 1.1rem;
      letter-spacing: 1px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .quick-log-feedback.show { opacity: 1; }
    #num-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
    #num-input-box { background: #1a1a1a; padding: 2.5rem; border-radius: 30px; text-align: center; width: 85%; max-width: 320px; border: 1px solid #333; }
    #numeric-field { width: 100%; background: transparent; border: none; border-bottom: 2px solid var(--accent); color: #fff; font-size: 3rem; text-align: center; outline: none; margin-bottom: 20px; }
    .action-btn { background: rgba(255,255,255,0.15); border: none; color: var(--text-color); width: 35px; height: 35px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .copy-btn { width: 100%; margin-top: 10px; padding: 15px; border-radius: 20px; background: rgba(255,255,255,0.05); color: var(--text-color); border: 1px solid rgba(255,255,255,0.15); text-transform: uppercase; letter-spacing: 2px; font-size: 0.7rem; cursor: pointer; }
    a.location-link { color: var(--text-color); text-decoration: underline; text-underline-offset: 4px; }
    .floyd-says {
      margin-top: 1.4rem;
      padding: 1.2rem 0 0.4rem;
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .floyd-says-block { margin-bottom: 1rem; }
    .floyd-says-text {
      font-size: 0.95rem;
      font-weight: 300;
      color: rgba(255,255,255,0.85);
      font-style: italic;
      line-height: 1.5;
      margin-top: 0.35rem;
      display: block;
    }
    /* maintenance modal */
    #maint-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:1100; justify-content:center; align-items:center; }
    .maint-panel { background:#141414; border:1px solid #333; border-radius:24px; width:90%; max-width:420px; max-height:85vh; overflow-y:auto; padding:1.6rem; box-sizing:border-box; }
    .maint-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
    .maint-head h2 { font-size:0.95rem; font-weight:400; letter-spacing:2px; text-transform:uppercase; color:var(--accent); margin:0; }
    .maint-x { background:none; border:none; color:#888; font-size:1.5rem; line-height:1; cursor:pointer; }
    .maint-tabs { display:flex; gap:6px; margin-bottom:1.1rem; }
    .maint-tab { flex:1; padding:8px 0; font-size:0.62rem; letter-spacing:1px; text-transform:uppercase; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); color:#aaa; border-radius:14px; cursor:pointer; }
    .maint-tab.active { background:var(--accent); color:#000; border-color:var(--accent); }
    .maint-sec { display:none; }
    .maint-sec.active { display:block; }
    .maint-field { width:100%; box-sizing:border-box; background:#0c0c0c; border:1px solid #333; border-radius:12px; color:#fff; font-size:0.95rem; padding:10px 12px; margin-bottom:10px; font-family:-apple-system,sans-serif; }
    textarea.maint-field { min-height:90px; resize:vertical; }
    .maint-go { width:100%; padding:13px; border-radius:14px; background:#fff; color:#000; border:none; font-weight:600; letter-spacing:1px; text-transform:uppercase; font-size:0.72rem; cursor:pointer; }
    .maint-go:active { opacity:0.7; }
    .maint-note { font-size:0.72rem; color:#888; margin:0 0 10px; line-height:1.45; }
    .maint-why { font-size:0.78rem; color:var(--accent); font-style:italic; margin:0 0 10px; }
    .maint-feedback { font-size:0.75rem; color:var(--accent); text-align:center; min-height:1.1rem; margin-top:8px; }
  </style>
</head>
<body>

  <div id="num-overlay">
    <div id="num-input-box">
      <div id="modal-label" class="label" style="margin-bottom:15px;">Update</div>
      <input type="number" inputmode="decimal" id="numeric-field">
      <div style="display:flex; gap:10px;">
        <button onclick="closeModal()" style="flex:1; padding:12px; background:#333; color:#fff; border-radius:12px; border:none;">Cancel</button>
        <button id="save-num-btn" style="flex:1; padding:12px; background:#fff; color:#000; border-radius:12px; border:none; font-weight:bold;">Save</button>
      </div>
    </div>
  </div>

  <div id="maint-overlay">
    <div class="maint-panel">
      <div class="maint-head">
        <h2>Maintenance</h2>
        <button class="maint-x" onclick="closeMaint()">&times;</button>
      </div>
      <div class="maint-tabs">
        <button class="maint-tab active" data-sec="tags" onclick="maintTab('tags')">Tags</button>
        <button class="maint-tab" data-sec="memory" onclick="maintTab('memory')">Memory</button>
        <button class="maint-tab" data-sec="questions" onclick="maintTab('questions')">Questions</button>
      </div>

      <div class="maint-sec active" id="sec-tags">
        <p class="maint-note" id="tags-count">Loading tags…</p>
        <input class="maint-field" id="tag-name" placeholder="#newtag" autocapitalize="off" autocorrect="off">
        <select class="maint-field" id="tag-retention">
          <option value="forever">forever — keep</option>
          <option value="days">days — expire</option>
          <option value="latest">latest — replace</option>
        </select>
        <input class="maint-field" id="tag-notes" placeholder="What is this tag for?">
        <button class="maint-go" onclick="addTag()">Add tag</button>
        <div class="maint-feedback" id="tags-fb"></div>
      </div>

      <div class="maint-sec" id="sec-memory">
        <p class="maint-note">Edit what Floyd remembers. The sheet is the source of truth.</p>
        <select class="maint-field" id="mem-pick" onchange="memPick()"><option value="">Loading…</option></select>
        <input class="maint-field" id="mem-desc" placeholder="One-line description">
        <textarea class="maint-field" id="mem-body" placeholder="The memory…"></textarea>
        <button class="maint-go" onclick="saveMem()">Save memory</button>
        <div class="maint-feedback" id="mem-fb"></div>
      </div>

      <div class="maint-sec" id="sec-questions">
        <p class="maint-note" id="q-count">Loading questions…</p>
        <p class="value" id="q-text" style="font-size:1.05rem;line-height:1.4;"></p>
        <p class="maint-why" id="q-why"></p>
        <textarea class="maint-field" id="q-answer" placeholder="Answer when you have time…"></textarea>
        <button class="maint-go" onclick="answerQ()">Save answer</button>
        <button class="maint-tab" style="width:100%;margin-top:8px;" onclick="nextQ()">Skip to another</button>
        <div class="maint-feedback" id="q-fb"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div id="status-container">Syncing...</div>
    <div id="action-container"></div>
    <div id="floyd-says" class="floyd-says" style="display:none;"></div>
    <div id="card-curiosity" class="floyd-says" style="display:none;"></div>

    <div class="quick-log">
      <span class="label">Log</span>
      <input
        type="text"
        class="quick-log-input"
        id="quick-log-input"
        placeholder="What's on your mind?"
        autocomplete="off"
        autocorrect="on"
        spellcheck="true"
      >
      <div class="quick-log-footer">
        <span class="quick-log-tag" id="quick-log-tag">—</span>
        <button class="quick-log-submit" id="quick-log-btn" onclick="submitQuickLog()">Log It</button>
      </div>
      <div class="quick-log-feedback" id="quick-log-feedback"></div>
    </div>

    <button class="copy-btn" style="margin-top:1.4rem;" onclick="openMaint()">⚙ Maintenance</button>
  </div>

  <script src="config.js"></script>
  <script>
    const API_URL = FLOYD_CONFIG.api_url;
    let activeKey = "";
    let voiceTimer;
    let ownerBirthday = '';
    let ownerId = '';
    let partnerId = '';
    let mapsUrl = 'https://www.google.com/maps?q=';
    let voiceLang = 'en-US';
    let recognition = null;

    let tagKeywords = [];
    let tagDebounceTimer = null;
    let pendingTagForSubmit = '#note';
    let pendingConfident = false;

    function loadTagKeywords(data) {
      if (data._tag_keywords && Array.isArray(data._tag_keywords)) {
        tagKeywords = data._tag_keywords;
      }
    }

    function scoreTagClientSide(text) {
      if (!text.trim() || tagKeywords.length === 0) return { tag: '#note', confident: false };
      const lower = text.toLowerCase();
      let best = { tag: '#note', score: 0, confident: false };
      let topScore = 0;
      let tied = false;

      tagKeywords.forEach(item => {
        const tag = item.tag || item[0] || '';
        const keywords = (item.keywords || item[1] || '').toString().split(',').map(k => k.trim().toLowerCase()).filter(Boolean);
        const priority = parseFloat(item.priority || item[2] || 1);
        let hits = 0;
        keywords.forEach(kw => { if (kw && lower.includes(kw)) hits++; });
        const score = hits * priority;
        if (score > topScore) { topScore = score; tied = false; best = { tag, score, confident: hits >= 1 }; }
        else if (score === topScore && score > 0) { tied = true; }
      });

      if (tied || topScore === 0) return { tag: '#note', confident: false };
      return best;
    }

    function onQuickLogInput() {
      const text = document.getElementById('quick-log-input').value;
      const tagEl = document.getElementById('quick-log-tag');

      if (!text.trim()) {
        tagEl.textContent = '—';
        tagEl.classList.remove('active');
        pendingTagForSubmit = '#note';
        pendingConfident = false;
        return;
      }

      const clientResult = scoreTagClientSide(text);
      tagEl.textContent = clientResult.tag;
      tagEl.classList.toggle('active', clientResult.confident);
      pendingTagForSubmit = clientResult.tag;
      pendingConfident = clientResult.confident;

      clearTimeout(tagDebounceTimer);
      tagDebounceTimer = setTimeout(() => {
        const encoded = encodeURIComponent(text);
        const cbName = '_tagScoreCallback_' + Date.now();
        window[cbName] = function(result) {
          if (result && result.tag) {
            pendingTagForSubmit = result.tag;
            pendingConfident = result.confident;
            tagEl.textContent = result.tag;
            tagEl.classList.toggle('active', result.confident);
          }
          delete window[cbName];
        };
        const s = document.createElement('script');
        s.src = API_URL + '?type=smart_tag&text=' + encoded + '&callback=' + cbName + '&t=' + Date.now();
        document.body.appendChild(s);
      }, 300);
    }

    async function submitQuickLog() {
      const input = document.getElementById('quick-log-input');
      const btn = document.getElementById('quick-log-btn');
      const feedback = document.getElementById('quick-log-feedback');
      const text = input.value.trim();
      if (!text) return;

      btn.classList.add('sending');
      btn.textContent = '…';

      const now = new Date();
      const daysAlive = ownerBirthday
        ? Math.floor((now - new Date(ownerBirthday)) / 86400000)
        : 0;

      const entry = {
        days_alive: daysAlive,
        person: ownerId || 'owner',
        tag: pendingTagForSubmit || '#note',
        value: text,
        notes: '',
        confidence: pendingConfident ? 1 : 0.7,
        ai: 'dashboard'
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({ key: 'import_entries', entries: [entry], ai: 'dashboard', token: FLOYD_CONFIG.api_secret })
        });

        const tagLabel = entry.tag;
        feedback.textContent = '✓ Logged as ' + tagLabel + (pendingConfident ? '' : ' (unqualified)');
        feedback.classList.add('show');
        input.value = '';
        document.getElementById('quick-log-tag').textContent = '—';
        document.getElementById('quick-log-tag').classList.remove('active');
        pendingTagForSubmit = '#note';
        pendingConfident = false;

        setTimeout(() => feedback.classList.remove('show'), 3000);
      } catch (err) {
        feedback.textContent = 'Could not reach Floyd — try again.';
        feedback.classList.add('show');
        setTimeout(() => feedback.classList.remove('show'), 3000);
      }

      btn.classList.remove('sending');
      btn.textContent = 'Log It';
    }

    document.getElementById('quick-log-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); submitQuickLog(); }
    });
    document.getElementById('quick-log-input').addEventListener('input', onQuickLogInput);

    function initRecognition(lang) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return;
      recognition = new SR();
      recognition.lang = lang || 'en-US';
      recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById('status-container').innerText = "Logging: " + text;
        await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ key: 'voice_note', value: text, token: FLOYD_CONFIG.api_secret }) });
        setTimeout(refresh, 1500);
      };
    }

    function handleAction(key, url) {
      if (url) { window.open(url, '_blank'); return; }
      if (key === 'context_builder') window.open('context.html', '_blank');
    }

    function updateLocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(function(pos) {
        const coords = pos.coords.latitude + ',' + pos.coords.longitude;
        fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ key: 'current_location', value: coords, token: FLOYD_CONFIG.api_secret }) });
      });
    }

    let lastSeenSent = 0;
    function pingSeen() {
      const now = Date.now();
      if (now - lastSeenSent < 5 * 60 * 1000) return;   // throttle: at most every 5 min
      lastSeenSent = now;
      fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ key: 'last_seen', value: new Date().toISOString(), token: FLOYD_CONFIG.api_secret }) });
    }

    function refresh() {
      updateLocation();
      pingSeen();
      loadCardCuriosity();
      var script = document.createElement('script');
      script.src = API_URL + '?type=dashboard&callback=render&t=' + Date.now();
      document.body.appendChild(script);
    }

    function triggerUpdate(editKey, label) {
      activeKey = editKey;
      document.getElementById('modal-label').innerText = label;
      document.getElementById('numeric-field').value = "";
      document.getElementById('num-overlay').style.display = 'flex';
      setTimeout(() => document.getElementById('numeric-field').focus(), 100);
    }

    function closeModal() { document.getElementById('num-overlay').style.display = 'none'; }

    document.getElementById('save-num-btn').onclick = async function() {
      const val = document.getElementById('numeric-field').value;
      if (!val) return;
      this.innerText = "...";
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ key: activeKey, value: val, token: FLOYD_CONFIG.api_secret })
      });
      this.innerText = "Save";
      closeModal();
      refresh();
    };

    function startVoice(e) {
      e.preventDefault();
      if (!recognition) return;
      voiceTimer = setTimeout(() => {
        try { recognition.start(); window.navigator.vibrate && window.navigator.vibrate(50); } catch(e) {}
      }, 600);
    }

    function stopVoice() {
      clearTimeout(voiceTimer);
      if (!recognition) return;
      try { recognition.stop(); } catch(e) {}
    }

    function render(data) {
      if (data._owner_birthday) ownerBirthday = data._owner_birthday;
      if (data._owner_id)       ownerId       = data._owner_id;
      if (data._partner_id)     partnerId     = data._partner_id;
      if (data._maps_url)       mapsUrl       = data._maps_url;
      if (data._accent_color) {
        document.documentElement.style.setProperty('--accent', data._accent_color);
      }

      loadTagKeywords(data);

      if (data._voice_lang && data._voice_lang !== voiceLang) {
        voiceLang = data._voice_lang;
        initRecognition(voiceLang);
      } else if (!recognition) {
        initRecognition(voiceLang);
      }

      if (data._app_title)  document.title = data._app_title;
      if (data._touch_icon) document.getElementById('touch-icon').href = data._touch_icon;
      if (data._favicon)    document.getElementById('favicon').href    = data._favicon;

      if (data._themes && data._themes[data.system_mode]) {
        const theme = data._themes[data.system_mode];
        const root = document.documentElement;
        root.style.setProperty('--bg',          theme.background);
        root.style.setProperty('--card-bg',     theme.card);
        root.style.setProperty('--label-color', theme.label);
        root.style.setProperty('--text-color',  theme.text || '#fff');
        document.body.style.background = theme.background;
      }

      document.body.className = 'mode-' + (data.system_mode || 'home');

      const container       = document.getElementById('status-container');
      const actionContainer = document.getElementById('action-container');
      const config          = data._display_config || [];
      const actions         = data._actions        || [];
      const mode            = data.system_mode     || 'home';
      const partnerStatus   = data.partner_status  || 'home';

      const visible = config
        .filter(item => {
          if (item.modes !== 'all' && !item.modes.split(',').includes(mode)) return false;
          if (item.condition === 'always') return true;
          if (item.condition === 'partner_status=home'    && partnerStatus === 'home')    return true;
          if (item.condition === 'partner_status=working' && partnerStatus === 'working') return true;
          return false;
        })
        .sort((a, b) => a.priority - b.priority);

      let html = '';
      visible.forEach(item => {
        const key   = item.key;
        const label = item.label;
        const value = data[key];

        if (!value && key !== 'current_location') return;

        if (key === 'current_location') {
          const icon = data.location_icon || 'tuliptown.webp';
          html += `<div class="status-item">
            <span class="label">Location</span>
            <div class="location-container">
              <span class="value"><a href="${mapsUrl}${value}" target="_blank" class="location-link">${data.location_city}</a></span>
              <div class="mode-icon" style="background-image:url('${icon}')"
                ontouchstart="startVoice(event)" ontouchend="stopVoice()"></div>
            </div></div>`;
        } else {
          const btn = item.editable
            ? `<button class="action-btn" onclick="triggerUpdate('${item.edit_key}','${label}')">✎</button>`
            : '';
          html += `<div class="status-item">
            <span class="label">${label}</span>
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="value value-${key}">${value}</span>${btn}
            </div></div>`;
        }
      });
      container.innerHTML = html;

      let btnHtml = '';
      actions
        .filter(a => a.modes === 'all' || a.modes.split(',').includes(mode))
        .sort((a, b) => a.priority - b.priority)
        .forEach(a => {
          if (a.style === 'link') {
            btnHtml += `<button class="copy-btn" onclick="handleAction('${a.key}','${a.url || ''}')">${a.label}</button>`;
          }
        });
      // Evolution loop: surface a Proposals button when Floyd has open tap-proposals.
      // The key-gated hub URL is built HERE (client-side) from the token already in
      // FLOYD_CONFIG — it is never written to a sheet / the open read surface.
      const propCount = parseInt(data.proposals_pending || '0', 10) || 0;
      if (propCount > 0 && FLOYD_CONFIG.checkin_url) {
        const hub = FLOYD_CONFIG.checkin_url.replace(/\/$/, '') + '/proposals?key=' + encodeURIComponent(FLOYD_CONFIG.api_secret);
        btnHtml = `<button class="copy-btn" onclick="window.open('${hub}','_blank')">🌱 Floyd proposes ${propCount} change${propCount > 1 ? 's' : ''}</button>` + btnHtml;
      }
      actionContainer.innerHTML = btnHtml;

      const floydSays = document.getElementById('floyd-says');
      const focus = data.focus_today;
      const brief = data.floyd_brief;
      if (focus || brief) {
        let sayHtml = '';
        if (focus) {
          sayHtml += `<div class="floyd-says-block">
            <span class="label">Focus</span>
            <span class="floyd-says-text">${focus}</span>
          </div>`;
        }
        if (brief) {
          sayHtml += `<div class="floyd-says-block">
            <span class="label">Floyd</span>
            <span class="floyd-says-text">${brief}</span>
          </div>`;
        }
        floydSays.innerHTML = sayHtml;
        floydSays.style.display = 'block';
      } else {
        floydSays.style.display = 'none';
      }
    }

    // ── Maintenance modal ─────────────────────────────────────────────
    let qList = [], qIdx = 0;
    function jsonp(type, cb) {
      const n = '_cb_' + Math.random().toString(36).slice(2);
      const s = document.createElement('script');
      window[n] = function(d){ try { cb(d); } finally { delete window[n]; s.remove(); } };
      s.onerror = function(){ delete window[n]; s.remove(); };
      s.src = API_URL + '?type=' + encodeURIComponent(type) + '&callback=' + n + '&t=' + Date.now();
      document.body.appendChild(s);
    }
    function postFloyd(body) {
      return fetch(API_URL, { method:'POST', mode:'no-cors', body: JSON.stringify({ ...body, token: FLOYD_CONFIG.api_secret }) });
    }
    function openMaint() {
      document.getElementById('maint-overlay').style.display = 'flex';
      loadTags(); loadMem(); loadQuestions();
    }
    function closeMaint() { document.getElementById('maint-overlay').style.display = 'none'; }
    function maintTab(sec) {
      document.querySelectorAll('.maint-tab').forEach(t => t.classList.toggle('active', t.dataset.sec === sec));
      document.querySelectorAll('.maint-sec').forEach(s => s.classList.toggle('active', s.id === 'sec-' + sec));
    }

    function loadTags() {
      jsonp('tags', d => {
        const rows = (d && d.rows) || [];
        document.getElementById('tags-count').textContent = rows.length + ' tags defined.';
      });
    }
    function addTag() {
      let tag = document.getElementById('tag-name').value.trim();
      if (!tag) return;
      if (tag[0] !== '#') tag = '#' + tag;
      const retention = document.getElementById('tag-retention').value;
      const action = retention === 'forever' ? 'keep' : (retention === 'latest' ? 'replace' : 'expire');
      const notes = document.getElementById('tag-notes').value.trim();
      postFloyd({ key:'sheet_update', sheet:'LOG_RULES', rows:[{ match_column:1, match_value:tag, values:{ '1':tag, '2':retention, '4':action, '5':notes } }] });
      document.getElementById('tags-fb').textContent = '✓ ' + tag + ' added';
      document.getElementById('tag-name').value = '';
      document.getElementById('tag-notes').value = '';
      setTimeout(loadTags, 1500);
    }

    function loadMem() {
      jsonp('memory_read', d => {
        const rows = (d && d.rows) || [];
        window._mem = {};
        let opts = '<option value="">+ new memory…</option>';
        rows.filter(r => r.name).forEach(r => { window._mem[r.name] = r; opts += '<option value="' + r.name + '">' + r.name + '</option>'; });
        document.getElementById('mem-pick').innerHTML = opts;
      });
    }
    function memPick() {
      const r = (window._mem || {})[document.getElementById('mem-pick').value] || {};
      document.getElementById('mem-desc').value = r.description || '';
      document.getElementById('mem-body').value = r.body || '';
    }
    function saveMem() {
      let name = document.getElementById('mem-pick').value;
      if (!name) { name = prompt('New memory name (kebab-case):'); if (!name) return; }
      const desc = document.getElementById('mem-desc').value.trim();
      const body = document.getElementById('mem-body').value.trim();
      postFloyd({ key:'sheet_update', sheet:'AI_MEMORY', rows:[{ match_column:1, match_value:name, values:{ '1':name, '2':desc, '4':body, '6':new Date().toISOString(), '7':'pwa' } }] });
      document.getElementById('mem-fb').textContent = '✓ saved ' + name;
      setTimeout(loadMem, 1500);
    }

    function loadQuestions() {
      jsonp('curiosity_read', d => {
        qList = ((d && d.rows) || []).filter(r => r.status === 'open');
        qIdx = 0;
        showQ();
      });
    }
    function showQ() {
      document.getElementById('q-fb').textContent = '';
      document.getElementById('q-count').textContent = qList.length + ' open question' + (qList.length === 1 ? '' : 's') + '.';
      const q = qList[qIdx];
      document.getElementById('q-text').textContent = q ? q.question : 'No open questions — Floyd is all caught up.';
      document.getElementById('q-why').textContent = (q && q.why) ? 'why: ' + q.why : '';
      document.getElementById('q-answer').value = '';
    }
    function nextQ() { if (qList.length) { qIdx = (qIdx + 1) % qList.length; showQ(); } }
    function answerQ() {
      const q = qList[qIdx];
      if (!q) return;
      const ans = document.getElementById('q-answer').value.trim();
      if (!ans) return;
      const now = new Date().toISOString();
      postFloyd({ key:'sheet_update', sheet:'CURIOSITY', rows:[{ match_column:1, match_value:q.id, values:{ '7':ans, '5':'answered', '10':now } }] });
      postFloyd({ key:'import_entries', ai:'pwa', entries:[{ person: ownerId || 'owner', tag:'#note', value: ans, notes:'answer to ' + q.id + ': ' + q.question, confidence:1, ai:'pwa' }] });
      document.getElementById('q-fb').textContent = '✓ logged — thank you';
      qList.splice(qIdx, 1);
      if (qIdx >= qList.length) qIdx = 0;
      setTimeout(showQ, 1500);
    }

    // Inline curiosity on the dashboard card — shown when you're IN Floyd, so
    // you can answer right where you are (no push needed).
    function loadCardCuriosity() {
      jsonp('curiosity_read', d => {
        const el = document.getElementById('card-curiosity');
        if (!el) return;
        const open = ((d && d.rows) || []).filter(r => r.status === 'open');
        if (!open.length) { el.style.display = 'none'; return; }
        open.sort((a, b) =>
          (Number(a.asked_count) || 0) - (Number(b.asked_count) || 0) ||
          (Number(a.priority) || 99) - (Number(b.priority) || 99));
        const q = open[0];
        el.dataset.qid = q.id;
        el.innerHTML =
          '<span class="label">🐤 Floyd\'s curious</span>' +
          '<span class="floyd-says-text" style="font-style:normal;">' + q.question + '</span>' +
          '<input class="quick-log-input" id="card-q-input" placeholder="Answer when you have a moment…" autocomplete="off" style="margin-top:10px;">' +
          '<div class="quick-log-footer"><span class="quick-log-tag">' + open.length + ' open</span>' +
          '<button class="quick-log-submit" onclick="answerCardQ()">Send</button></div>' +
          '<div class="quick-log-feedback" id="card-q-fb"></div>';
        el.style.display = 'block';
      });
    }
    function answerCardQ() {
      const el = document.getElementById('card-curiosity');
      const id = el && el.dataset.qid;
      const input = document.getElementById('card-q-input');
      const ans = input ? input.value.trim() : '';
      if (!id || !ans) return;
      const now = new Date().toISOString();
      postFloyd({ key: 'sheet_update', sheet: 'CURIOSITY', rows: [{ match_column: 1, match_value: id, values: { '7': ans, '5': 'answered', '10': now } }] });
      postFloyd({ key: 'import_entries', ai: 'pwa', entries: [{ person: ownerId || 'owner', tag: '#note', value: ans, notes: 'answer to ' + id, confidence: 1, ai: 'pwa' }] });
      const fb = document.getElementById('card-q-fb');
      if (fb) { fb.textContent = '✓ logged — thank you'; fb.classList.add('show'); }
      setTimeout(loadCardCuriosity, 1500);
    }

    refresh();
    setInterval(refresh, 60000);
  </script>
</body>
</html>
